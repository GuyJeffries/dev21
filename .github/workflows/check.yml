name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system libraries bpy links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libsm6 libice6 libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxkbcommon0

      - name: Lint, format check, tests
        run: ./scripts/check.sh

      - name: Contact sheet of the golden seeds
        run: uv run arcology sheet specs/default.json -o build/review

      # Two artifacts so reviewing on a slow link means downloading ~80 KB, not every library.
      - name: Upload contact sheet and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contact-sheet
          path: |
            build/review/contact_sheet.jpg
            build/review/metrics.md
            build/review/metrics.json

      - name: Upload plans, element libraries and tiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-full
          path: build/review/

      - name: Write job summary
        if: always() && hashFiles('build/review/metrics.md') != ''
        run: |
          cat build/review/metrics.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Contact sheet: the \`contact-sheet\` artifact (~80 KB). Plans, libraries and tiles: \`review-full\`." >> "$GITHUB_STEP_SUMMARY"
