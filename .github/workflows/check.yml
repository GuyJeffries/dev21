name: check

on:
  push:
  workflow_dispatch:

jobs:
  # Commits go to main and to the session branch together. When the session branch's commit is
  # already on main, its checks run there; running them twice only doubles the load.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # identical: main's head; behind: an ancestor of main. Either way it's already on main.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status || echo unknown)
          if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Commit $GITHUB_SHA is already on main, where its checks run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The package mirror has hung this step for the job's whole time limit; give each attempt
      # five minutes and try once more.
      - name: Install system libraries bpy links against
        timeout-minutes: 11
        run: |
          install() {
            timeout 300 sudo bash -c '
              apt="apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60"
              $apt update && $apt install -y --no-install-recommends \
                libgl1 libsm6 libice6 libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxkbcommon0
            '
          }
          install || { echo "::warning::installing system libraries failed or timed out; retrying"; install; }

      - name: Lint, format check, tests
        run: ./scripts/check.sh

      - name: Elevation sheet of the golden seeds (layer trees, no Blender)
        run: uv run arcology elevations specs/default.json -o build/elevations

      - name: Contact sheet of the golden seeds (L2)
        run: uv run arcology sheet specs/default.json -o build/review

      - name: Detail sheet of three seeds (L0 close-ups)
        run: uv run arcology detail specs/default.json -o build/detail --samples 16

      - name: Sweep sheet of the style parameters (L2, one seed)
        run: uv run arcology sweep specs/default.json -o build/sweep

      - name: Batch of 100 seeds (L3 silhouettes, style envelope)
        run: uv run arcology batch specs/default.json -o build/batch

      - name: What-if sheet of the treatments (L0, mid-range)
        run: uv run arcology whatif specs/default.json -o build/whatif

      # Two artifacts so reviewing on a slow link means downloading ~1 MB, not every library.
      - name: Upload review sheets and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-sheets
          path: |
            build/review/contact_sheet.jpg
            build/review/metrics.md
            build/review/metrics.json
            build/detail/detail_sheet.jpg
            build/elevations/elevation_sheet.jpg
            build/sweep/sweep_sheet.jpg
            build/sweep/sweep.md
            build/batch/batch_sheet.jpg
            build/batch/batch.md
            build/whatif/whatif_sheet.jpg
            build/whatif/whatif.md

      - name: Upload plans, element libraries and tiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-full
          path: |
            build/review/
            build/detail/
            build/sweep/
            build/batch/
            build/whatif/

      - name: Write job summary
        if: always() && hashFiles('build/review/metrics.md') != ''
        run: |
          cat build/review/metrics.md >> "$GITHUB_STEP_SUMMARY"
          for table in build/batch/batch.md build/whatif/whatif.md build/sweep/sweep.md; do
            if [ -f "$table" ]; then echo "" >> "$GITHUB_STEP_SUMMARY"; cat "$table" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sheets: the \`review-sheets\` artifact (contact_sheet.jpg, detail_sheet.jpg, elevation_sheet.jpg, whatif_sheet.jpg, sweep_sheet.jpg, batch_sheet.jpg). Plans, libraries and tiles: \`review-full\`." >> "$GITHUB_STEP_SUMMARY"
