[project]
name = "assetgen"
version = "0.1.0"
description = "Seeded procedural game assets generated with Blender (bpy) and exported as glTF."
readme = "README.md"
# bpy wheels are built for exactly one Python minor version; 5.2.x targets 3.13.
requires-python = "==3.13.*"
dependencies = ["bpy==5.2.2"]

[project.scripts]
assetgen = "assetgen.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
